name: find_my_patterns
description: "Self-hosted mood pattern diary — the Flutter client for the find-my-patterns backend."
publish_to: 'none'

# Keep in sync with AppConfig.appVersion — test/core/config/app_config_test.dart
# fails the build if the two ever drift.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  cookie_jar: ^4.0.9
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  dio_cookie_manager: ^3.5.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^3.4.2
  flutter_timezone: ^5.1.0
  go_router: ^18.0.0
  intl: ^0.20.3
  path_provider: ^2.1.5
  record: ^7.1.1
  shared_preferences: ^2.5.5
  timezone: ^0.11.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  yaml: ^3.1.2

flutter:
  uses-material-design: true
