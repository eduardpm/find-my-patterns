name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A push to a PR branch should cancel the in-flight run for that branch's old
  # commit — nobody needs a superseded commit's result. A push to main should
  # not: every merge must get a completed post-merge verification run, so this
  # only cancels in-progress runs when the ref is not the default branch.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [backend, web]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # --ci changes nothing on disk and fails on anything unformatted, which is
      # what makes this the same gate a developer runs locally.
      - run: ./scripts/check --ci
      - run: flutter build apk --debug

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix web
      - run: npm run build --prefix backend
      - run: npm run build --prefix web
      - run: npm exec --prefix web -- playwright install --with-deps chromium
      # golden.db is no longer committed (#83) — build it from schema.ts + golden-seed.json instead
      # of reading a binary that two branches could not both migrate without a merge conflict.
      - run: npm run build-golden-db --prefix backend
      - run: cp backend/tests/fixtures/golden.db /tmp/diary-e2e.db
      - name: Start backend
        run: DATABASE_PATH=/tmp/diary-e2e.db PORT=18080 HOST=127.0.0.1 npm start --prefix backend &
      - name: Wait for backend
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:18080/health && exit 0
            sleep 1
          done
          exit 1
      - run: E2E_BASE_URL=http://127.0.0.1:18080 npm run test:e2e --prefix web
